# CI — §11의 리스크 대응("3개 OS 전부 테스트")이 실제로 도는 자리.
#
# Windows 잡이 backlog의 "Windows 스위트 재실행"을 상시화한다 — ADR-78
# (credential helper의 sh 실행) 같은 크로스플랫폼 가정이 여기서 검증된다.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # GUI 테스트를 헤드리스로 — pytest-qt가 실제 창 없이 돈다.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt 런타임 라이브러리 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: git 신원 (테스트 하네스가 커밋을 만든다)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: 테스트
        run: python -m pytest -q

  package:
    # 배포 산출물이 실제로 만들어지고 실행되는지 — LGPL 준수 형태(onedir,
    # Qt 공유 라이브러리 분리)를 지키는 스펙이 깨지면 여기서 드러난다.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: 빌드
        run: pyinstaller --distpath dist --workpath build packaging/gitclient.spec
      - name: 스모크 — 실행 파일이 살아 있는가
        shell: bash
        run: |
          ./dist/gitclient/gitclient --version
      - uses: actions/upload-artifact@v4
        with:
          name: gitclient-${{ runner.os }}
          path: dist/gitclient
          retention-days: 14
