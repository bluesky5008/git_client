# CI — §11의 리스크 대응("3개 OS 전부 테스트")이 실제로 도는 자리.
#
# Windows 잡이 backlog의 "Windows 스위트 재실행"을 상시화한다 — ADR-78
# (credential helper의 sh 실행) 같은 크로스플랫폼 가정이 여기서 검증된다.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # GUI 테스트를 헤드리스로 — pytest-qt가 실제 창 없이 돈다.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt 런타임 라이브러리 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: git 신원 (테스트 하네스가 커밋을 만든다)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: 테스트
        run: python -m pytest -q

  package:
    # 배포 산출물이 실제로 만들어지고 실행되는지 — LGPL 준수 형태(onedir,
    # Qt 공유 라이브러리 분리)를 지키는 스펙이 깨지면 여기서 드러난다.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: 빌드
        run: pyinstaller --distpath dist --workpath build packaging/gitclient.spec
      - name: 스모크 — 실행되고, 자기 버전을 아는가
        shell: bash
        run: |
          # 출력 내용까지 본다 — "실행되는가"만 물으면 dist-info 누락으로
          # "(개발 트리)"를 답하는 배포본이 통과한다 (0.1.0 배포 준비에서
          # 실제로 겪었다, doc/release.md §1.3).
          out="$(./dist/gitclient/gitclient --version)"
          echo "$out"
          case "$out" in
            *"개발 트리"*) echo "배포본이 자기 버전을 모른다"; exit 1 ;;
          esac
      # 설치본까지 만든다 — 빌드는 되는데 배포본에서 깨지는 경우를
      # 릴리스 직전이 아니라 여기서 만난다. **서명은 하지 않는다**:
      # Developer ID·코드서명 인증서는 이 저장소의 자원이 아니라
      # 키를 가진 사람이 이어서 돌린다 (packaging/*의 주석 참조).
      - name: dmg (macOS)
        if: runner.os == 'macOS'
        run: sh packaging/make_dmg.sh
      - name: 인스톨러 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\gitclient.iss
      - uses: actions/upload-artifact@v4
        with:
          name: gitclient-${{ runner.os }}
          path: |
            dist/gitclient
            dist/*.dmg
            dist/*setup*.exe
          retention-days: 14
